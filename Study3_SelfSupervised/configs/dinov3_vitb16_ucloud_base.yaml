# Study 3 DINOv3-B/16 domain-specific SSL template.
# make_ucloud_training_config.py replaces the allocation-dependent values.
MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ""
  DTYPE: float32

compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP

train:
  batch_size_per_gpu: 32
  dataset_path: null
  output_dir: null
  num_workers: 8
  OFFICIAL_EPOCH_LENGTH: 1074
  seed: 0
  compile: false
  cache_dataset: false

student:
  # Released dinov3_vitb16 contract: 12 blocks, 768 channels, 12 heads,
  # 16-pixel patches, and four storage tokens.
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.1
  pretrained_weights: ""
  norm_layer: layernormbf16
  n_storage_tokens: 4
  mask_k_bias: true
  pos_embed_rope_rescale_coords: 2.0
  pos_embed_rope_dtype: fp32

dino:
  loss_weight: 1.0
  koleo_loss_weight: 0.1
  head_n_prototypes: 65536

ibot:
  loss_weight: 1.0
  head_n_prototypes: 65536
  mask_sample_probability: 0.5
  mask_ratio_min_max: [0.1, 0.5]

crops:
  global_crops_size: 224
  global_crops_scale: [0.32, 1.0]
  local_crops_number: 8
  local_crops_size: 96
  local_crops_scale: [0.05, 0.32]

optim:
  epochs: 100
  warmup_epochs: 10
  freeze_last_layer_epochs: 1

teacher:
  warmup_teacher_temp_epochs: 10

evaluation:
  eval_period_iterations: 1074

checkpointing:
  period: 1074
  max_to_keep: 3
  keep_every: 99999999999999999
