# Local stability pilot for official DINOv3 SSL on the 416-image subset.
# This is still an engineering pilot, not a study result.
MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ""
  DTYPE: float32

compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP

train:
  batch_size_per_gpu: 4
  dataset_path: null
  output_dir: null
  num_workers: 2
  # 416 images / batch 4 = 104 optimizer iterations per nominal pass.
  OFFICIAL_EPOCH_LENGTH: 104
  seed: 0
  compile: false
  cache_dataset: false

student:
  arch: vit_small
  patch_size: 16
  drop_path_rate: 0.1
  pretrained_weights: ""
  norm_layer: layernormbf16
  n_storage_tokens: 4
  mask_k_bias: true
  pos_embed_rope_rescale_coords: 2.0
  pos_embed_rope_dtype: fp32

dino:
  loss_weight: 1.0
  koleo_loss_weight: 0.1
  head_n_prototypes: 8192

ibot:
  loss_weight: 1.0
  head_n_prototypes: 8192
  mask_sample_probability: 0.5
  mask_ratio_min_max: [0.1, 0.5]

crops:
  global_crops_size: 224
  global_crops_scale: [0.32, 1.0]
  local_crops_number: 4
  local_crops_size: 96
  local_crops_scale: [0.05, 0.32]

optim:
  epochs: 2
  warmup_epochs: 1
  freeze_last_layer_epochs: 1

teacher:
  warmup_teacher_temp_epochs: 1

evaluation:
  eval_period_iterations: 104

checkpointing:
  period: 104
  max_to_keep: 2
  keep_every: 99999999999999999

